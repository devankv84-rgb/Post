name: Build postmarketOS flashable ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git python3 python3-pip openssl \
          libssl-dev libtool autoconf automake \
          build-essential
    
    - name: Install pmbootstrap from git
      run: |
        pip3 install --upgrade pip
        pip3 install git+https://git.sr.ht/~postmarketos/pmbootstrap
    
    - name: Verify pmbootstrap installation
      run: |
        pmbootstrap --version
    
    - name: Initialize pmbootstrap config
      run: |
        mkdir -p ~/.config
        cat > ~/.config/pmbootstrap.cfg << EOF
        [main]
        aports_upstream_url = https://gitlab.com/postmarketOS/pmaports
        device = samsung-gtowifi
        hostname = pmos
        keymap = us
        locale = en_US.UTF-8
        work = ~/.local/var/pmbootstrap
        EOF
    
    - name: Build flashable ZIP
      run: |
        pmbootstrap -y install --android-recovery-zip --password=test123
      timeout-minutes: 120
    
    - name: Export built images
      run: |
        mkdir -p build-output
        pmbootstrap export
        if [ -d ~/.local/var/pmbootstrap/chroot_native/tmp/postmarketOS-export ]; then
          cp ~/.local/var/pmbootstrap/chroot_native/tmp/postmarketOS-export/* build-output/ 2>/dev/null || true
        fi
        ls -lah build-output/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: postmarketos-flashable-zip
        path: build-output/
        retention-days: 30
    
    - name: Create Release (on push to main)
      if: github.event_name == 'push' && success()
      uses: softprops/action-gh-release@v1
      with:
        files: build-output/*.zip
        tag_name: build-${{ github.run_number }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
