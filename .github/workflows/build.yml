name: Build postmarketOS flashable ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '0 0 * * 0'  # Weekly build

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git python3 python3-pip openssl \
          libssl-dev libtool autoconf automake
    
    - name: Install pmbootstrap
      run: |
        git clone --depth=1 https://git.sr.ht/~postmarketos/pmbootstrap
        cd pmbootstrap
        pip3 install .
        cd ..
    
    - name: Initialize pmbootstrap config
      run: |
        mkdir -p ~/.config
        cat > ~/.config/pmbootstrap.cfg << EOF
        [main]
        aports_upstream_url = https://gitlab.com/postmarketOS/pmaports
        device = samsung-gtowifi
        hostname = pmos
        keymap = us
        locale = en_US.UTF-8
        work = ~/.local/var/pmbootstrap
        EOF
    
    - name: Build flashable ZIP
      run: |
        pmbootstrap -y install --android-recovery-zip --password=test123
    
    - name: Export built images
      run: |
        mkdir -p build-output
        pmbootstrap export
        cp ~/.local/var/pmbootstrap/chroot_native/tmp/postmarketOS-export/* build-output/ 2>/dev/null || true
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: postmarketos-zip
        path: build-output/
        retention-days: 30
    
    - name: Create Release (on push to main)
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        files: build-output/*.zip
        tag_name: build-${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
